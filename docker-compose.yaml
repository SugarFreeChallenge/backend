version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: api
    env_file:
      - .env
    volumes:
      - .:/app
    ports:
      - "8000:5000"
    environment:
      - FLASK_ENV=development
      - FLASK_APP=app
    depends_on:
      - db
    command: flask run --host=0.0.0.0 --port=5000

  db:
    image: postgres:15
    container_name: db
    environment:
      POSTGRES_USER: sugarfree
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: sugarfree_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: